get_invoice_document:
  fields:
    invoice_id_hash:
      required: true
      example: "abc123def456"
      selector:
        text:

get_invoices:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: octopus_spain
    limit:
      required: false
      default: 12
      example: 12
      selector:
        number:
          min: 1
          max: 24
          mode: box

get_latest_invoice_document:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: octopus_spain

get_invoice_document_by_index:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: octopus_spain
    index:
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 23
          mode: box

get_measurements:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: octopus_spain
    start_date:
      required: false
      example: "2026-04-01"
      selector:
        date:
    end_date:
      required: false
      description: "Fecha final exclusiva: 2026-05-01 devuelve datos hasta 2026-04-30 inclusive."
      example: "2026-05-01"
      selector:
        date:
    frequency:
      required: false
      default: DAY_INTERVAL
      example: DAY_INTERVAL
      selector:
        select:
          options:
            - label: Daily
              value: DAY_INTERVAL
            - label: Hourly
              value: HOUR_INTERVAL
